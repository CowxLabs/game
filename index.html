<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Demo</title>
<meta name="description" content="GitHub Pages demo: browser game">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
  --text: #c9d1d9; --text2: #8b949e; --heading: #f0f6fc;
  --primary: #58a6ff; --primary-hover: #79c0ff;
  --border: #30363d; --success: #3fb950; --warning: #d29922; --danger: #f85149;
  --card-bg: #161b22; --shadow: 0 1px 3px rgba(0,0,0,.3);
  --radius: 8px; --font: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;
  --transition: .3s ease;
}
[data-theme="light"] {
  --bg: #ffffff; --bg2: #f6f8fa; --bg3: #eaeef2;
  --text: #24292f; --text2: #57606a; --heading: #1f2328;
  --primary: #0969da; --primary-hover: #0550ae;
  --border: #d0d7de; --card-bg: #ffffff; --shadow: 0 1px 3px rgba(0,0,0,.12);
}
html { scroll-behavior: smooth; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column;
  transition: background var(--transition), color var(--transition);
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 24px; background: var(--bg2); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100; backdrop-filter: blur(8px);
  transition: background var(--transition);
}
.logo { font-size: 1.25rem; font-weight: 700; color: var(--heading); display: flex; align-items: center; gap: 8px; }
.logo-icon { width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
#theme-toggle {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  width: 40px; height: 40px; border-radius: var(--radius); cursor: pointer;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
#theme-toggle:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
main { flex: 1; max-width: 960px; margin: 0 auto; padding: 40px 24px; width: 100%; }
footer {
  text-align: center; padding: 24px; color: var(--text2);
  border-top: 1px solid var(--border); font-size: .875rem;
  transition: border-color var(--transition);
}
footer a { color: var(--primary); }
.hero { text-align: center; padding: 60px 0 40px; }
.hero h1 { font-size: 2.5rem; font-weight: 800; color: var(--heading); margin-bottom: 16px; }
.hero p { font-size: 1.15rem; color: var(--text2); max-width: 640px; margin: 0 auto 24px; }
.btn {
  display: inline-block; background: var(--primary); color: #fff; padding: 10px 24px;
  border-radius: var(--radius); font-weight: 600; border: none; cursor: pointer;
  transition: all var(--transition); font-size: .95rem;
}
.btn:hover { background: var(--primary-hover); text-decoration: none; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--bg3); }
.card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px; transition: all var(--transition);
}
.card:hover { border-color: var(--primary); box-shadow: 0 4px 12px rgba(88,166,255,.15); }
.grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.section-title { font-size: 1.5rem; font-weight: 700; color: var(--heading); margin: 40px 0 20px; }
.tag {
  display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: .8rem;
  background: var(--bg3); color: var(--primary); border: 1px solid var(--border);
}
.badge {
  display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: .75rem;
  font-weight: 600;
}
.badge-green { background: rgba(63,185,80,.15); color: var(--success); }
.badge-yellow { background: rgba(210,153,34,.15); color: var(--warning); }
.badge-red { background: rgba(248,81,73,.15); color: var(--danger); }
.badge-blue { background: rgba(88,166,255,.15); color: var(--primary); }
</style>
<style>#clickBtn:active{transform:scale(.9)}</style>
</head>
<body>
<nav>
  <a href="/" class="logo"><span class="logo-icon">&#x25B6;</span>Game</a>
  <button id="theme-toggle" aria-label="Toggle theme">&#x2600;</button>
</nav>
<main>
  <section class="hero">
    <h1>Game</h1>
    <p>GitHub Pages demo: a browser game with dark/light mode.</p>
  </section>
  
<div style="text-align:center">
  <h2 style="color:var(--heading);margin-bottom:8px;font-size:1.3rem">Click Counter</h2>
  <p style="color:var(--text2);margin-bottom:24px">How fast can you click? You have 10 seconds!</p>
  <div style="display:flex;justify-content:center;gap:32px;margin-bottom:24px">
    <div><span style="color:var(--text2);font-size:.85rem">Score</span><div id="score" style="font-size:2.5rem;font-weight:800;color:var(--heading)">0</div></div>
    <div><span style="color:var(--text2);font-size:.85rem">Time</span><div id="timer" style="font-size:2.5rem;font-weight:800;color:var(--heading)">10</div></div>
    <div><span style="color:var(--text2);font-size:.85rem">High Score</span><div id="highScore" style="font-size:2.5rem;font-weight:800;color:var(--primary)">0</div></div>
  </div>
  <button id="clickBtn" class="btn" style="width:200px;height:200px;border-radius:50%;font-size:1.5rem;cursor:pointer;background:var(--primary);color:#fff;border:none;transition:transform .1s">CLICK ME!</button>
  <div style="margin-top:24px">
    <button id="resetBtn" class="btn btn-outline" style="padding:8px 24px">Reset</button>
  </div>
  <p id="message" style="color:var(--text2);margin-top:16px;font-size:.9rem">Click the button to start!</p>
</div>
<script>
let score = 0, timeLeft = 10, highScore = parseInt(localStorage.getItem('gameHighScore')||'0'), running = false, interval;
const scoreEl = document.getElementById('score'), timerEl = document.getElementById('timer');
const highEl = document.getElementById('highScore'), msgEl = document.getElementById('message');
const btn = document.getElementById('clickBtn'), resetBtn = document.getElementById('resetBtn');
highEl.textContent = highScore;
btn.addEventListener('click', () => {
  if (!running) { running = true; timeLeft = 10; score = 0; msgEl.textContent = 'Go go go!'; interval = setInterval(() => { timeLeft--; timerEl.textContent = timeLeft; if (timeLeft <= 0) { clearInterval(interval); running = false; btn.style.background = 'var(--bg3)'; if (score > highScore) { highScore = score; localStorage.setItem('gameHighScore', highScore); highEl.textContent = highScore; msgEl.textContent = 'New high score!'; } else { msgEl.textContent = 'Time\'s up! Click Reset to try again.'; } } }, 1000); btn.style.background = 'var(--primary)'; }
  if (running) { score++; scoreEl.textContent = score; btn.style.transform = 'scale(.95)'; setTimeout(() => btn.style.transform = 'scale(1)', 100); }
});
resetBtn.addEventListener('click', () => { clearInterval(interval); running = false; score = 0; timeLeft = 10; scoreEl.textContent = '0'; timerEl.textContent = '10'; msgEl.textContent = 'Click the button to start!'; btn.style.background = 'var(--primary)'; });
</script>
</main>
<footer>
  <p>Powered by <a href="https://pages.github.com">GitHub Pages</a> &mdash; <a href="https://github.com/CowxLabs/game">Source</a></p>
</footer>
<script>
const toggle = document.getElementById('theme-toggle');
const html = document.documentElement;
const stored = localStorage.getItem('theme');
if (stored) html.setAttribute('data-theme', stored);
else html.setAttribute('data-theme', 'dark');
toggle.textContent = html.getAttribute('data-theme') === 'dark' ? '\u2600' : '\uD83C\uDF19';
toggle.addEventListener('click', () => {
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  toggle.textContent = next === 'dark' ? '\u2600' : '\uD83C\uDF19';
});
</script>
</body>
</html>
